[package]
name = "shoot-em"
version = "1.0.0"
edition = "2021"
description = "Shoot 'em: Jan Ringos' 3D shooter drawn in coloured text, rebuilt for today's terminals"
license-file = "LICENSE"
publish = false

[[bin]]
name = "shoot-em"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
xmrs = "0.15"
xmrsplayer = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
